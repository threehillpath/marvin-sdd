name: Bug Report
description: Report a reproducible defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a bug. All required fields must be completed. Provide as much detail as possible so the issue can be reproduced and investigated.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence description of what is broken.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal, ordered steps to trigger the bug.
      placeholder: |
        1. Step one
        2. Step two
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: "The system should..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happens? Include error messages, stack traces, or screenshots if relevant.
      placeholder: "Instead, the system..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, OS, browser, or any configuration details relevant to reproducing the issue.
      placeholder: |
        - Version: ...
        - OS: ...
        - Shell / runtime: ...
    validations:
      required: false
